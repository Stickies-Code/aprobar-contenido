<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<body>
<div class="wrap">
  <header class="top">
    <img class="logo logo-l" src="/assets/logo.svg" alt="Criscolor" width="155" height="31">
    <img class="logo logo-d" src="/assets/logo-w.svg" alt="" aria-hidden="true" width="155" height="31">
    <h1 id="wkTitle">Semana</h1>
    <div class="weeks" id="weeks" role="group" aria-label="Semana"></div>
    <p class="notice" id="notice" hidden></p>
  </header>

<div class="modal" id="nameModal" hidden>
  <form id="nameForm">
    <h3>¿Quién revisa?</h3>
    <p>Escribe tu nombre. Solo te lo pedimos una vez.</p>
    <input id="nameInput" name="name" maxlength="40" autocomplete="name" placeholder="Tu nombre" required>
    <div class="row"><button type="button" id="nameCancel">Cancelar</button><button type="submit">Guardar</button></div>
  </form>
</div>
